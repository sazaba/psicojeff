name: Generate favicon PNG

on:
  push:
    branches:
      - favicon-png
    paths:
      - .github/workflows/generate-favicon.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert Logo.webp to square PNG favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path('public/Logo.webp')
          target = Path('public/favicon.png')

          with Image.open(source) as image:
              print(f'Source: {image.format} {image.size} mode={image.mode}')
              image = image.convert('RGBA')
              contained = ImageOps.contain(image, (512, 512), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (512, 512), (255, 255, 255, 0))
              x = (512 - contained.width) // 2
              y = (512 - contained.height) // 2
              canvas.alpha_composite(contained, (x, y))
              canvas.save(target, format='PNG', optimize=True)
              print(f'Generated: {target} {canvas.size}')
          PY

      - name: Commit generated favicon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PNG favicon from Logo.webp"
          git push
